name: SiteWatch
options:
  bundleIdPrefix: app.sitewatch
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  SiteWatch:
    type: application
    platform: iOS
    sources:
      - SiteWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sitewatch.networkmonitor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SiteWatch
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: SiteWatch necesita acceder a tu red local para comprobar los puertos de gestión de los equipos que registres.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
schemes:
  SiteWatch:
    build:
      targets:
        SiteWatch: all
    run:
      config: Debug
    archive:
      config: Release
